services:
  - type: web
    name: hisobchi-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_URL
        value: sqlite+aiosqlite:///hisobchi.db
      - key: DEFAULT_LANG
        value: uz_lat
      - key: TIMEZONE
        value: Asia/Tashkent
